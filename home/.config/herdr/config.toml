# reference: herdr --default-config
#
# t = tab, w = workspace. lowercase creates, shift renames,
# and shift promotes a tab action to its workspace equivalent.

[keys]
prefix = "ctrl+a"

goto = "prefix+space"

# pane
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
rename_pane = "prefix+ctrl+p"
close_pane = "prefix+x"

# tab
new_tab = "prefix+t"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# workspace
new_workspace = "prefix+w"
rename_workspace = "prefix+shift+w"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
switch_workspace = "prefix+shift+1..9"
close_workspace = "prefix+shift+d"
workspace_picker = "prefix+ctrl+w"
